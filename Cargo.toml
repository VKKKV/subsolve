[package]
name = "subsolve"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Offline substitution cipher solver using quadgram statistics, hill climbing, and Vigenere analysis"
authors = ["subsolve contributors"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
